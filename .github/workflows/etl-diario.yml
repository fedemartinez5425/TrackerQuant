name: ETL diario

# Baja precios de Yahoo en lote, controla la calidad, reescribe la pestaña
# `precios` de Google Sheets y guarda el snapshot del día.
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   GCP_SERVICE_ACCOUNT_JSON       contenido completo del JSON de la service account
#   GOOGLE_SHEETS_SPREADSHEET_ID   el mismo ID que está en los Secrets de Streamlit Cloud

on:
  schedule:
    # Lunes a viernes 22:30 UTC = 19:30 Argentina: después del cierre de NYSE
    # (18:00 ART en horario de verano de EE.UU., 18:00/19:00 en invierno) y de BYMA (17:00).
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}  # botón "Run workflow" para correrlo a mano

concurrency:
  group: etl-precios
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Credenciales de Google
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Falta el secret GCP_SERVICE_ACCOUNT_JSON"; exit 1
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service_account.json"
      - name: ETL de precios + snapshot
        env:
          STORAGE_BACKEND: gsheets
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/service_account.json
        run: python scripts/etl_precios.py
      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/service_account.json"
