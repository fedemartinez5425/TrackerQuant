name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Misma versión que Streamlit Cloud (requirements.txt no fija una).
          python-version: "3.14"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        # Los tests no salen a internet (tests/conftest.py): no hacen falta secrets.
        run: pytest -q tests
