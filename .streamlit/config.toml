[theme]
# Mismos colores que core/viz/palette.py (sliders, checkboxes, foco y grilla de tablas
# usan este tema; el resto lo pinta app_style.py).
base = "dark"
primaryColor = "#00E8A8"
backgroundColor = "#070B0A"
secondaryBackgroundColor = "#131F1B"
textColor = "#EAF6F1"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
